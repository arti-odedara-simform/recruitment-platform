# What Vite's dev proxy does for `npm run dev`, nginx does for the compose stack: the
# browser only ever talks to this origin, and `/api/*` is forwarded server-side. So the
# "No CORS on the API" decision holds in both environments, and the API's middleware
# stack — including its exactly-two-anonymous-routes surface — is untouched by the
# existence of a frontend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The trailing slash on proxy_pass strips the prefix, matching the `rewrite` in
    # vite.config.ts: the client calls /api/pipeline, the API sees /pipeline.
    location /api/ {
        proxy_pass http://api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints these filenames, so a stale one can never be served for new
    # content and they are safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is the one file that must not be cached: it is what points at the
    # current fingerprinted bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: /reqs, /applications/:id and friends are React Router paths
    # that exist only in the bundle, so anything not on disk is answered with the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
